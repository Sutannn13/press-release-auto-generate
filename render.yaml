services:
  - type: web
    name: kemenag-depok-press-release
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    previews:
      generation: "off"
    envVars:
      - key: GEMINI_API_KEY_PRIMARY
        sync: false
      - key: GEMINI_MODEL_PRIMARY
        value: gemini-3.6-flash
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-3.5-flash-lite
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
